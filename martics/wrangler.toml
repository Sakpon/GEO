name = "martics-geo-tracker"
main = "src/worker/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Static SPA (Vite build output). The Worker runs first for every request so it
# can route /api/* itself; everything else is delegated to env.ASSETS.fetch(),
# which honours the SPA not-found fallback below.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Daily aggregation cron (P0). 03:00 UTC ≈ 10:00 Asia/Bangkok.
[triggers]
crons = ["0 3 * * *"]

[vars]
RUNS_PER_CYCLE = "5"
# Comma-separated engines the cron + /api/run will execute. Perplexity is the
# Phase-1 scaffold engine. Add "google_aio","chatgpt" once those engines ship.
ACTIVE_ENGINES = "perplexity"
PARSER_MODEL = "claude-sonnet-4-6"

# --- Bindings (create with wrangler, then paste the IDs) ---------------------
# wrangler d1 create martics
[[d1_databases]]
binding = "DB"
database_name = "martics"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# wrangler kv namespace create CONFIG
[[kv_namespaces]]
binding = "CONFIG"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set with `wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY   — parser (Sonnet) + future fix-loop
#   PERPLEXITY_API_KEY  — scaffold engine
#   GEMINI_API_KEY      — P1 engine (not used in this build)
