name: AIO smoke (tag triggered)

# A real, on-demand smoke run of the AIO probe against SerpApi.
# Triggered ONLY by pushing a tag matching "aio-run-*" (a deliberate action),
# so it can never fire from ordinary pushes or commit-message text. Prints the
# report to the job log and commits nothing (a smoke run is not a baseline).
#
# To run:   git tag aio-run-1 <commit> && git push origin aio-run-1
# Requires the SERPAPI_API_KEY repository Actions secret.

on:
  push:
    tags:
      - "aio-run-*"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r experiments/requirements.txt

      - name: Real smoke run (core tier, 1 run each)
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ -z "$SERPAPI_API_KEY" ]; then
            echo "::error::SERPAPI_API_KEY secret is not set."; exit 1
          fi
          cd experiments
          python aio_citation_probe.py --tier core --n-runs 1 --yes

      - name: Print report to log
        run: |
          echo "===== Markdown report ====="
          cat workspace/geo-audits/*-aio-citation-probe.md
          echo "===== Raw runs ====="
          cat experiments/results/*-raw.jsonl
